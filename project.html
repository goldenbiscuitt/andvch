<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project | Arian Dave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Project Page Specific Layout */
      .project-header {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 60vw;
        padding: 40px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
        font-family: var(--font-mono);
      }

      .header-left .logo-link {
        color: white;
        text-decoration: none;
        font-weight: 700;
        font-size: 1.1rem;
        letter-spacing: -1px;
      }

      .header-right {
        display: flex;
        gap: 32px;
      }

      .nav-link {
        color: var(--text-primary);
        text-decoration: none;
        font-size: 1rem;
        opacity: 0.6;
        transition: opacity 0.3s ease;
      }

      .nav-link:hover {
        opacity: 1;
      }

      .project-main {
        margin-top: 25vh;
        padding-bottom: 10vh;
      }

      .project-info {
        max-width: 66.66%;
        margin-bottom: 8rem;
      }

      .project-title {
        font-family: var(--font-mono);
        font-size: clamp(2.5rem, 6vw, 5rem);
        margin-bottom: 2rem;
        letter-spacing: -3px;
      }

      .project-description {
        font-size: 1.5rem;
        line-height: 1.6;
        color: var(--text-secondary);
      }

      .project-visual {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #111;
        border-radius: 24px;
        margin-bottom: 10vh;
      }
    </style>
  </head>

  <body>
    <!-- Vertical Background Grid Lines -->
    <div class="grid-lines" aria-hidden="true">
      <div class="grid-col"><div class="line"></div><div class="line"></div></div>
      <div class="grid-col"><div class="line"></div><div class="line"></div></div>
      <div class="grid-col"><div class="line"></div><div class="line"></div></div>
      <div class="grid-col"><div class="line"></div><div class="line"></div></div>
      <div class="grid-col"><div class="line"></div><div class="line"></div></div>
      <div class="grid-col"><div class="line"></div><div class="line"></div></div>
    </div>

    <header class="project-header">
      <div class="header-left">
        <a href="index.html" class="logo-link magnetic-link">andvch</a>
      </div>
      <div class="header-right">
        <a href="#" class="nav-link magnetic-link">Previous</a>
        <a href="#" class="nav-link magnetic-link">Next</a>
      </div>
    </header>

    <main class="project-main">
      <div class="container">
        <div class="project-info">
          <h1 class="project-title">Future Narratives</h1>
          <p class="project-description">
            Exploring the emotional connection between generative systems and human perception through minimal interfaces and intentional motion.
          </p>
        </div>
        
        <div class="project-visual"></div>
        <div class="project-visual" style="background: #0a0a0a;"></div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-left-group">
        <a href="index.html" class="back-to-top" aria-label="Back to home">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round" class="house-icon">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </a>
        <div class="footer-links">
          <a href="https://x.com/andvch" class="social-link magnetic-link" target="_blank"
            rel="noopener noreferrer">twitter</a>
          <span class="footer-dot">•</span>
          <a href="https://github.com/goldenbiscuitt" class="social-link magnetic-link" target="_blank"
            rel="noopener noreferrer">github</a>
          <span class="footer-dot">•</span>
          <a href="https://linkedin.com/in/adcheca" class="social-link magnetic-link" target="_blank"
            rel="noopener noreferrer">linkedin</a>
        </div>
      </div>
      <div class="footer-credit">
        <b>made in The Philippines</b> <br>
        <span class="disclaimer">referenced to the portfolio of <a href="https://azumbrunnen.me/" target="_blank"
            rel="noopener noreferrer">adrian</a>.</span>
      </div>
    </footer>

    <div class="custom-cursor" id="custom-cursor"></div>
    <script type="module" src="main.js"></script>
  </body>

</html>
